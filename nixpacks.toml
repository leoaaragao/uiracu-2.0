# Corrige "ImportError: libexpat.so.1: cannot open shared object file" no deploy do
# Railway — rasterio/GDAL precisam dessa biblioteca de sistema em tempo de execucao.
#
# 1a tentativa (nixPkgs/nixLibs = pacote Nix) nao resolveu — a variavel de ambiente
# que o Nix usa (LD_LIBRARY_PATH) aparentemente nao chegou ate o processo do site em
# tempo de execucao. 2a tentativa: pacotes apt (.deb), que instalam a biblioteca no
# caminho padrao do sistema operacional (/usr/lib/...) e sao registrados via ldconfig
# — o linker dinamico encontra sem precisar de nenhuma variavel de ambiente extra.
[phases.setup]
aptPkgs = ["libexpat1", "zlib1g", "libsqlite3-0"]
